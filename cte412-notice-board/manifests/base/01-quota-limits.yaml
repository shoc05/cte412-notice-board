# manifests/base/01-quota-limits.yaml
# Purpose : ResourceQuota (hard caps for the whole namespace) and LimitRange
#           (default and permitted size of one container) for nb-02230146.
# Apply   : kubectl apply -f manifests/base/01-quota-limits.yaml
#
# Planned peak, used to justify every number below (Tasks 7 and 8):
#   3 blue + 3 green + 1 surge Pod during a green rollout + 1 monitor = 8 Pods,
#   plus up to 2 Pods still draining after SIGTERM  =>  at most 10 of the 15 allowed.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nb-quota
  namespace: nb-02230146
spec:
  # Hard limits required by Task 1.3.
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "15"
    # 3 Services exist at most (notice-board, notice-board-ext, notice-board-preview).
    count/services: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: nb-limits
  namespace: nb-02230146
spec:
  limits:
    - type: Container
      # defaultRequest 50m CPU / 64Mi: 10 Pods x 50m = 500m (half of requests.cpu 1) and
      # 10 x 64Mi = 640Mi (62% of requests.memory 1Gi). Small enough that the surge Pod
      # of every rolling update is always admitted, large enough for a Python API.
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      # default limit 150m CPU / 128Mi: 10 Pods x 150m = 1500m (75% of limits.cpu 2) and
      # 10 x 128Mi = 1280Mi (62.5% of limits.memory 2Gi). Ratio 3:2 allows short bursts
      # (start-up) without letting one Pod starve the others.
      default:
        cpu: 150m
        memory: 128Mi
      # min 10m CPU / 16Mi: the smallest container in the namespace (the monitor, which
      # asks for exactly this) is admitted; anything smaller is rejected as a mistake.
      min:
        cpu: 10m
        memory: 16Mi
      # max 500m CPU / 256Mi: no single container may hold more than a quarter of
      # limits.cpu (2) or an eighth of limits.memory (2Gi), so one Pod cannot exhaust the quota.
      max:
        cpu: 500m
        memory: 256Mi
